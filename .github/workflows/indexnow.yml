name: Notify search engines with IndexNow

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: techmintai-indexnow
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore last submitted page fingerprints
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state
          key: indexnow-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-state-
      - name: Submit new, changed and removed live URLs
        run: python3 scripts/indexnow.py
      - name: Save fingerprints after accepted submission
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state
          key: indexnow-state-${{ github.run_id }}-${{ github.run_attempt }}
