name: Astro build, links & SEO audit
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture generated lockfile for reproducible installs
        run: |
          echo "TECHMINT_LOCK_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "TECHMINT_LOCK_END"
      - name: Build website
        run: npm run build
      - name: Check internal links
        run: npm run check:links
      - name: Audit SEO & page weight
        run: npm run check:quality
