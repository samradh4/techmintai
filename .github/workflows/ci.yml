name: Astro build, links & SEO audit
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build website
        run: npm run build
      - name: Check internal links
        run: npm run check:links
      - name: Audit SEO & page weight
        run: npm run check:quality
      - name: Audit browser security and published files
        run: npm run check:security
